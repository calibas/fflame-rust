# fflame-render — the Endless Gallery's renderer, as a standalone
# WASM module. FractalConfig JSON + dimensions in, raw RGBA pixels out
# (canvas.putImageData on the JS side; PNG encoding, if wanted, is
# canvas.toBlob — no image codecs in here).
#
# Standalone: deliberately NOT a member of the main crate's build, like
# every crate under wasm/. The app must be unaffected by anything here.

[package]
name = "fflame-render"
version = "0.5.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false turns off `web-app`: without that, this
# module would inherit the full application's wasm-bindgen exports.
# It is the one gallery renderer, for every mode: the single-engine
# modules (wasm/flame, wasm/escape, wasm/sim) were retired on
# 2026-11-04, because the engines now use each other -- an escape lens,
# transformation or Flame Attractor names flame variations, a
# simulation layer is warped by the flame -- and a module without the
# catalog drew those configs wrong without saying so. `terrain` stays
# off: a terrain config renders as its 2D picture.
fractal_flame_wgpu = { path = "../..", default-features = false }
# The main crate's wgpu; its features (webgpu on wasm32, the native
# backends otherwise) come from the main crate and unify with this.
wgpu = { version = "29.0", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[dev-dependencies]
pollster = { version = "0.4", features = ["macro"] }
# The smoke tests edit a shipped config (a simulation's step count) and
# pick a preset out of the bundled file. Test-only: the module itself
# takes config JSON as a string.
serde_json = "1.0"

# Tests are not a shipping artifact. `cargo test --release` would pick
# up [profile.release] below — opt-level="z", fat LTO, one codegen unit
# — and spend minutes optimizing the whole parent crate for DOWNLOAD
# SIZE, to run a handful of tests. This profile keeps the optimization
# that makes the tests run fast and drops the part that only matters
# for the shipped .wasm.
[profile.gallery-test]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# wasm-pack bundles wasm-opt 117, which predates rustc's bulk-memory
# default — without these flags it rejects the module outright.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
