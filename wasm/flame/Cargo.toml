# fflame-flame — the flame renderer alone, as a standalone WASM module.
#
# The SAME SOURCE as ../render (see [lib] path): what differs is one
# Cargo feature. Without `engine-escape` the escape module is not
# compiled, taking the perturbation machinery -- fixed point, reference
# orbits, the double-double shadow, the orbit store -- out of the
# module.
#
# An escape config loaded here reports a missing engine rather than
# rendering something the file never described. ../render is the one
# that renders both.

[package]
name = "fflame-flame"
version = "0.5.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "../render/src/lib.rs"

[dependencies]
fractal_flame_wgpu = { path = "../..", default-features = false, features = ["engine-flame"] }
egui-wgpu = { version = "0.34", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[dev-dependencies]
pollster = { version = "0.4", features = ["macro"] }

[profile.gallery-test]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
