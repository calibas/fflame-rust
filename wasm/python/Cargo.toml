# fflame-python -- pyfflame's engine (python/): the engine as a WASI
# module Python loads with wasmtime, its GPU calls forwarded to wgpu-py
# through a wgpu custom backend. Standalone, like the gallery crates: the
# app must be unaffected by anything here. `cargo build --release` in
# this directory builds it for wasm32-wasip1 (.cargo/config.toml);
# python/build.py builds it and puts it in the package.

[package]
name = "fflame-python"
version = "0.5.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fractal_flame_wgpu = { path = "../..", default-features = false, features = ["engine-flame", "engine-escape", "engine-sim", "terrain"] }
serde = "1.0"
serde_json = "1.0"
# The same wgpu as the engine's; `serde` gives wgpu's enums their WebGPU
# names, which are what the host (wgpu-py) takes.
wgpu = { version = "29.0", default-features = false, features = ["std", "wgsl", "custom", "serde"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
