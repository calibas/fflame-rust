# fflame-sim — the simulation renderer alone, as a standalone WASM
# module.
#
# The SAME SOURCE as ../render (see [lib] path below), for the same
# reason ../escape shares it: the module's job is identical — config
# JSON in, RGBA out — and duplicating it to change one dependency
# feature would guarantee the copies drift.
#
# What differs is the Cargo features. Without `engine-flame` the
# variation catalog is `linear` alone, the other 646 defs are
# unreachable, and the linker drops them along with 1.1 MB of inline
# WGSL. Without `engine-escape` the perturbation machinery — reference
# orbits, the double-double shadow, the orbit store — goes with it.
# That is the entire saving, and it is why this crate exists.
#
# A simulation's own shader source is small: the models and colourings
# are inline WGSL like the variations, but there are 31 and 11 of them
# rather than 647.
#
# Loading a FLAME config here renders whatever a catalog of one
# variation can express — which is not the flame the file describes.
# An ESCAPE config reports the missing engine rather than rendering
# something the file never asked for. This module is for simulation
# configs; ../render is the one that renders all three.

[package]
name = "fflame-sim"
version = "0.5.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "../render/src/lib.rs"

[dependencies]
fractal_flame_wgpu = { path = "../..", default-features = false, features = ["engine-sim"] }
egui-wgpu = { version = "0.34", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[dev-dependencies]
pollster = { version = "0.4", features = ["macro"] }
# The smoke test edits a shipped config's step count to prove the grid
# actually steps. Test-only: the module itself takes config JSON as a
# string and never parses it.
serde_json = "1.0"

[profile.gallery-test]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
