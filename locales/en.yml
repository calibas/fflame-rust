escape_panel:
  reference_period: "Reference Period"
  tooltip_reference_period: "Period of the nucleus this location targets (fraktaler-3's reference.period). Verified before use; 0 = none. Enables the periodic deep reference that carries dives to extreme depth."
  detect_period: "Detect"
  tooltip_detect_period: "Ball-method period detection at the center's intrinsic depth. Runs in the background; minutes for large periods."
  searching_period: "Detecting period…"
  building_reference: "Computing reference orbit… %{percent}%"
  period_found: "Period %{period} — wrap exact to 2^-%{octave}, i.e. zoom ~%{zoom}"
  period_none: "No period under 8,000,000 wraps at this depth — leave the field empty and let the plain reference run."
  detected_period: "In use: period %{period}"
  tooltip_detected_period: "The period of the reference the renderer is using right now. Auto-detection finds deeper periods as a dive continues and retires shallow ones, so this can change while zooming."
  use_detected_period: "Use"
  supersample: "Antialiasing"
  supersample_off: "Off"
  tooltip_supersample: "Render at N\u00d7 resolution per axis and box-downsample. Smooths pixel noise in dense filigree at N\u00b2 the render cost."
  no_derivative_formula: "%{coloring} needs a derivative and %{formula} defines none \u2014 it renders flat rather than showing a plausible wrong image. Formulas that do: Mandelbrot, Multibrot, Tricorn, McMullen, Lambda, Spider, Barnsley, Cactus, Exponential, Trig, Lambda-Sine, Tetration."
  no_derivative_perturbed: "%{coloring} needs a derivative, and the deep-zoom path does not iterate one \u2014 it renders flat past the perturbation threshold. Zoom back out, or use a coloring that reads the orbit instead."
  shading: "Relief Shading"
  shading_enabled: "Enable"
  shading_light: "Light angle"
  shading_height: "Relief height"
  shading_softness: "Softness"
  tooltip_shading_softness: "Radius, in pixels, of the stencil the surface normal is estimated from. 0 is a single-pixel difference — the sharpest estimate, and the one that makes finely-detailed fields look crunchy. Raising it low-passes the NORMAL, so edges soften without blurring the colour underneath."
  shading_field: "Slope from"
  shading_field_smooth: "Value (smooth)"
  shading_field_banded: "Palette bands"
  shading_shadows: "Shadows"
  shading_highlights: "Highlights"
  blend_multiply: "Multiply"
  blend_screen: "Screen"
  blend_overlay: "Overlay"
  blend_mix: "Mix"
  tooltip_shading: "Light the coloring as a surface, using the slope of its own value field. A layer over the palette, so it works with every coloring — including the ones with no derivative."
  tooltip_shading_light: "Direction the light comes from, counter-clockwise from east. 315° (north-west) is the cartographic convention; lighting from the opposite side makes raised detail read as sunken."
  tooltip_shading_height: "Vertical exaggeration of the slope. Logarithmic, because the useful value depends on how many palette turns the coloring spends across the view — that differs by orders of magnitude between colorings."
  tooltip_shading_field: "Value: the coloring's number before the palette wraps it — smooth terrain relief. Palette bands: the wrapped coordinate, so every band edge becomes a step — an engraved, contour-map look."
  tooltip_shading_strength: "How far toward the blended result to travel. 0 leaves the image exactly untouched; past 1 the layer saturates sooner rather than going further. Values above 1 are for DARK images, where a pixel sits close to black and so moves much less toward black than toward white — that gap is the image's dynamic range, not the blend, and this is the control that compensates."
  tooltip_shading_blend: "How the layer composites: Multiply only darkens, Screen only lightens, Overlay keeps the palette's own contrast, Mix tints flatly."
  not_active_hint: "Switch to Escape mode above to edit the escape-time fractal."
  flame_only_hint: "This panel edits the flame and is inactive in Escape mode."
  open_escape_panel: "Open Escape Fractal panel"
  formula: "Formula"
  reference_section: "Reference orbit (engine)"
  diag_section: "Diagnostics"
  diag_path: "Path: %{path}"
  tooltip_diag_path: "Which render pipeline the last frame used. 'direct' iterates every pixel independently; the perturbed paths iterate deltas against a shared reference orbit (engaged past zoom 14)."
  diag_settle: "Last settle: %{ms} ms over %{frames} frame(s)"
  tooltip_diag_settle: "Wall time from a change being noticed to the image being final, and how many chunked frames that took. This is the latency you feel when editing."
  diag_inflight: "Rendering… frame %{frames}"
  diag_restarts: "Restarts: %{count}"
  tooltip_diag_restarts: "How many times the render started over from scratch. Every parameter, view or palette change restarts it; a counter climbing while you do nothing means something is thrashing."
  diag_render_cpu: "Render call CPU: %{ms} ms"
  tooltip_diag_render_cpu: "CPU time inside the last render call (orbit mirroring, table builds, command encoding) — GPU work is not included."
  diag_orbit: "Reference: %{len} iterations, %{source}, %{ms} ms"
  tooltip_diag_orbit: "The shared reference orbit: its length, whether the last request reused it / loaded it from disk / recomputed it, and the CPU time the current orbit's fixed-point compute has taken."
  diag_orbit_churn: "Orbit rebuilds: %{rebuilds}, worker waits: %{waits} frame(s)"
  tooltip_diag_orbit_churn: "Rebuilds count every time the reference was thrown away and recomputed since startup. Worker waits count frames that rendered nothing because the orbit thread had not published yet — each wait is a frame of visible lag."
  diag_upload: "Orbit upload: %{kb} KB"
  diag_bla: "BLA table: %{kb} KB, built in %{ms} ms"
  diag_bla_off: "BLA: inactive (per-step iteration)"
  diag_chunk: "Last chunk: %{iters} iterations"
  rendering: "Rendering… {percent}%"
  settled: "Render settled"
