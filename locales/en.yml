  export_resolution: "Export resolution: %{width}×%{height}"
  export_viewport_size: "Export will use current viewport size"

  # Preferences Section
  preferences: "Preferences"
  language: "Language"
  language_hint: "Language: Use the 🌐 globe icon in the menu bar"
  theme: "Theme"
  theme_dark: "Dark"
  theme_light: "Light"
  theme_high_contrast: "High Contrast"
  deterministic_rng: "Deterministic RNG"

  # Tooltips
  tooltip_iterations_per_thread: "GPU workgroup performance tuning.\nHigher values = fewer dispatches, better GPU utilization.\nLower values = more frequent updates, smoother animation."
  tooltip_burn_in: "Skip first N iterations before plotting.\nAllows points to 'settle' onto the attractor before contributing to the image.\nHigher values = cleaner results but slower convergence.\n0 = no burn-in (may show artifacts from random starting points)"
  tooltip_histogram_color_scale: "Controls color precision vs overflow protection in histogram accumulation.\nLower values prevent artifacts in zoomed-out scenes.\nHigher values give better color accuracy but overflow sooner.\n\n1-5: Maximum overflow protection (65535+ hits), very low precision\n10: Balanced (6553 hits, 10 color levels) - recommended default\n50: Higher precision (1310 hits, 50 color levels)\n100: Maximum precision (655 hits, 100 color levels) - classic"
  tooltip_target_iterations_per_pixel: "Stop accumulating pixel after N hits (0 = disabled).\nPrevents over-sampling dense areas.\nLow values (5-100) for quick previews.\nHigh values (100K-1M) for quality."
  tooltip_use_dynamic_blend: "Exponential convergence (old behavior).\nWhen enabled, blend rate adapts over time.\nWhen disabled, uses fixed blend rate below."
  tooltip_fixed_blend_rate: "Controls how quickly new samples blend with history.\nOnly active when Dynamic Blend is disabled.\n\n0.001 = Nearly permanent (very slow fade)\n0.01 = Very slow/smooth\n0.1 = Balanced (default)\n1.0 = Fast/flickery"
  tooltip_vsync: "Synchronize rendering with monitor refresh rate.\nEnabled = smoother, no tearing, capped at monitor refresh.\nDisabled = uncapped FPS, may tear, better for benchmarking."
  tooltip_vsync_wasm: "WebGPU only supports VSync mode (Fifo present mode)"
  tooltip_max_iterations: "Maximum iterations before rendering stops.\nHigher = more detail and smoother gradients.\nLower = faster preview, may look noisy."
  tooltip_deterministic_rng: "Use fixed random seed for reproducible rendering.\nEnable for testing/comparison, disable for varied output."

