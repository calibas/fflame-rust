# Tooltips
tooltips:
  zoom: "Controls the magnification level.\nHigher = more zoomed in."
  pan: "Move the fractal view left/right or up/down."
  rotation: "Rotate the entire view.\nKeyboard: R key + drag"
  camera_pitch: "3D camera rotation (up/down).\nOnly visible in 3D mode."
  camera_yaw: "3D camera rotation (left/right).\nOnly visible in 3D mode."

  transform_weight: "Probability of selecting this transform.\nHigher = more influence on final image."
  transform_color: "Position in color palette (0.0-1.0).\nAffects color when using Palette Color Mode."
  transform_edit_triangle: "Select in Triangle Editor"
  transform_clone: "Create a copy"
  transform_delete: "Delete"
  remove_variation: "Remove variation"
  final_transform_help: "Post-processing transform applied once to every point after iteration loop.\nUsed for framing, positioning, or global effects."

  affine_a: "X scale - horizontal stretch/compress"
  affine_b: "Y shear - vertical skew"
  affine_c: "X shear - horizontal skew"
  affine_d: "Y scale - vertical stretch/compress"
  affine_e: "X offset - horizontal translation"
  affine_f: "Y offset - vertical translation"
  affine_g: "Z offset - depth in 3D mode"
  color_speed: "How fast the color index changes during iteration.\n-1 to 1, where 0 = no change."
  opacity: "Transparency of points from this transform.\n0 = invisible, 1 = fully opaque"

  blend_rate: "How fast new samples blend with existing.\n0.01 = slow/smooth, 1.0 = fast/flickery"
  dynamic_blend: "Exponential convergence (old) vs fixed rate (new).\nFixed rate gives more consistent results."
  density_compression: "Slows accumulation in bright areas.\n0 = disabled, 100 = strong effect"

  histogram_color_scale: "Scaling factor for color accumulation.\nHigher = more vibrant colors."

