  tooltip_vibrancy: "Color saturation preservation.\n0 = colors wash out in bright areas,\n1 = colors stay saturated."
  tooltip_saturation: "Color saturation multiplier.\n0 = grayscale, 1 = no change, >1 = more colorful."
  tooltip_hue_shift: "Rotate all colors around the color wheel.\n180° = complementary colors."
