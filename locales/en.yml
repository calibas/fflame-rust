  tooltip_post_symmetry_rotation: "Pre-rotate the mirror copy around the center (degrees).\nAxis modes only."
  tooltip_post_symmetry_order: "Number of rotational copies for Point symmetry.\n2 = pair (180°), 3 = ternary (120°), 4 = quad (90°), …"

