  tooltip_pan: "Move the fractal view left/right or up/down."
  tooltip_rotation: "Rotate the entire view."
  tooltip_render_mode: "2D = classic flat rendering.\n3D = depth-aware with perspective."
  tooltip_mode_2d: "Classic flat rendering.\nAll points projected onto a 2D plane."
  tooltip_mode_3d: "Depth-aware rendering with perspective.\nEnables 3D variations and camera rotation."
  mode_escape: "Escape"
  tooltip_mode_escape: "Escape-time rendering (Mandelbrot and kin) — a per-pixel iteration instead of the chaos game"
  tooltip_perspective: "Strength of 3D perspective effect.\n0 = orthographic, higher = more depth."
  tooltip_camera_pitch: "3D camera rotation (up/down).\nTilts the view vertically."
  tooltip_camera_yaw: "3D camera rotation (left/right).\nRotates the view horizontally."
  tooltip_camera_bank: "3D camera bank (Y-axis tilt).\nCreates perspective skew."
  tooltip_camera_x: "Camera X position (world space)."
  tooltip_camera_y: "Camera Y position (world space)."
  tooltip_camera_z: "Camera Z position.\nMoves the viewpoint closer/further."
  tooltip_fly_mode: "Free-fly camera (3D mode).\nPrimary mouse drag = look around\nWASD = move forward/back/strafe\nQ/E = down/up\nShift = sprint\nF2 hotkey toggles."
  tooltip_depth_density_compensation: "Keeps brightness depth-invariant under perspective (0 = off, 1 = full).\nNear structures normally fade as the camera approaches (their samples spread over more pixels); this re-weights samples by depth so close structures keep their brightness — at the cost of more grain up close.\nFar structures dim symmetrically; the focal plane is unaffected."
  tooltip_far_density_fade: "Thins out far structures (0 = off).\nSample density fades with Gaussian falloff past the start distance: weight = exp(−distance² × strength).\nUnlike fog (which recolors), far structures genuinely vanish with distance."
  tooltip_far_density_fade_start: "Camera-space depth where the density fade begins.\nContent nearer than this is unaffected."
  tooltip_fly_camera_mode_free_look: "Screen-relative look (space-sim).\nDrag always turns relative to the screen — works at any orientation, never locks.\nCircling the mouse can roll the horizon; Q/E rise along screen-up."
  tooltip_fly_camera_mode_fps: "World-anchored look (FPS).\nHorizontal drag turns around the world's vertical axis — the horizon stays level and Rotation is never changed.\nQ/E rise along world up/down."
  tooltip_dof_focus_distance: "Distance from origin where image is sharpest.\nObjects at this depth appear in focus."
  tooltip_dof_blur_strength: "Amount of depth blur (0 = disabled).\nHigher values create stronger bokeh effect."
  tooltip_fog_strength: "Exponential fog density (0 = disabled).\nHigher values create denser atmospheric fog."
  tooltip_fog_start: "Depth where fog begins.\nNegative values start fog in front of origin."

