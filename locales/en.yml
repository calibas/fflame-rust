  tooltip_path_suffix_distinct: "Path end with hash scrambling for distinct colors"
  tooltip_path_depth: "Color by iteration depth (burn_in to 32), uses current palette"
  tooltip_path_origin_radial: "Color by distance from origin (0 to √2), uses current palette"
  tooltip_path_origin_horizontal: "Color by initial X position (-1 to 1), uses current palette"
  tooltip_path_origin_vertical: "Color by initial Y position (-1 to 1), uses current palette"
  tooltip_capture_first_hit: "Capture path on first pixel hit (includes burn-in transforms)"
  tooltip_capture_first_after_burnin: "Capture path on first hit, but only track transforms after burn-in"
  tooltip_capture_deepest_hit: "Keep path with most iterations - shows deepest path to each pixel"
  tooltip_tracking_first_32: "Store the first 32 iterations, then stop tracking"
  tooltip_tracking_recent_32: "Rolling window of the 32 most recent iterations"

