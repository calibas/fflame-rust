[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfflame"
version = "0.5.0"
description = "Fractal flames, escape-time fractals and simulations from Python: build, script, render and animate"
readme = "README.md"
requires-python = ">=3.9"
# The engine is a WebAssembly module (pyfflame/fflame.wasm, built by
# build.py): wasmtime runs it, wgpu-py does its GPU work. Both are
# platform wheels from their maintainers; this package has none of its own.
dependencies = ["wasmtime>=50", "wgpu>=0.32"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Image.to_numpy / Image.to_pil
images = ["numpy", "pillow"]

[tool.setuptools]
packages = ["pyfflame"]

[tool.setuptools.package-data]
pyfflame = ["fflame.wasm"]
