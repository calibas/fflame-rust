<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- maximum-scale=1.0 + user-scalable=no disables browser pinch-zoom.
         When iOS Safari pinch-zooms out, devicePixelRatio drops to ~0.1,
         which causes egui-winit's pixels_per_point to crash to 0.1, which
         inflates egui's logical screen_rect to ~10× the canvas size, which
         allocates a ~10000×10000 GPU buffer and crashes the tab. The app
         has its own zoom controls; browser pinch-zoom isn't useful here. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
    <title>Fractal Art Editor - Online Version</title>
    <!-- Inlined rather than a file reference: the wasm build copies
         only the palette packs into pkg/, so a separate favicon file
         would need a new copy step in build-wasm.bat AND .sh, kept in
         step by hand. Regenerate with scripts/make_icons.py. -->

    <!-- Query strings are cache-busters: WebKit clings to cached JS/CSS
         through ordinary reloads, and a stale vkb.js silently downgrades
         the keyboard (observed: the multiline textarea missing on iOS
         while every wasm-side change landed). They carry the app version:
         `release.py version` bumps them, and its `versions agree` gate
         fails while they lag. -->
    <link rel="stylesheet" href="css/vkb.css?v=0.5.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 20px 0;
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Anchor to all four edges of the visible viewport.
               Avoids iOS quirks with vh/svh and the home indicator. */
            position: fixed;
            inset: 0;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            /* Push content below iOS notch/Dynamic Island */
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        #canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
            /* Do NOT use `object-fit` or `image-rendering` here. Both treat
               the canvas as if it were a bitmap image and letterbox-fit it
               using `canvas.width × canvas.height` as the intrinsic ratio.
               That fights with WebGPU resize: every time the canvas buffer
               attribute changes, `object-fit: contain` recomputes the
               letterbox, the visible area flips, egui-reported viewport
               jumps, and the layout oscillates. We want the canvas to fill
               its container exactly; let the renderer match the buffer size
               to the container size explicitly. */
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 5px solid #333;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            max-width: 300px;
        }

        .info h3 {
            margin-bottom: 5px;
            color: #667eea;
        }

        .info ul {
            list-style: none;
            padding: 0;
        }

        .info li {
            margin: 3px 0;
        }

        .info code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>

        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Fractal Flame Renderer...</p>
        </div>
    </div>

    <script src="js/vkb.js?v=0.5.0"></script>
    <script type="module">
        import init from './pkg/fae.js';

        // ====================================================================
        // App initialization
        // ====================================================================

        async function run() {
            try {
                console.log('navigator.gpu available:', !!navigator.gpu);
                if (!navigator.gpu) {
                    console.warn('navigator.gpu not detected - will attempt initialization anyway');
                }

                // Initialize the WASM module
                await init();

                // Hide loading screen
                document.getElementById('loading').classList.add('hidden');

                // Block iOS Safari pinch-zoom and double-tap-zoom even when
                // user-scalable=no is set on the viewport meta (Safari often
                // ignores user-scalable=no on iPad for "accessibility").
                // Without this, pinch-zoom on iOS drops devicePixelRatio
                // toward 0, which inflates egui's screen_rect by 1/dpr and
                // crashes the tab on GPU buffer allocation.
                document.addEventListener('gesturestart', e => e.preventDefault());
                document.addEventListener('gesturechange', e => e.preventDefault());
                document.addEventListener('gestureend', e => e.preventDefault());

                // No JS resize handler here. Canvas sizing is winit's job:
                // winit observes the canvas via ResizeObserver, dispatches
                // WindowEvent::Resized to Rust, our handler applies the DPR
                // cap (1.5) via window.request_inner_size, and winit then
                // sets canvas.width/height to match. Single source of truth
                // for the canvas buffer size — no JS races, no drift.
                //
                // Previous versions had a JS handler that either:
                //   (a) did `canvas.width = currentWidth + 1` (force wgpu
                //       surface refresh). Cumulative drift; iOS Safari fires
                //       hundreds of resize events per minute and the canvas
                //       eventually drifted past 10000 px wide → OOM crash.
                //   (b) set canvas.width to `window.innerWidth * cappedDPR`.
                //       Raced winit's ResizeObserver (which sees full DPR);
                //       resize never converged, layout flapped between two
                //       sizes after every resize gesture.
                // Both removed.

                console.log('Fractal Flame Renderer initialized successfully!');
            } catch (error) {
                console.error('Failed to initialize:', error);
                document.getElementById('loading').innerHTML =
                    '<h2 style="color: #f44;">Error Loading</h2>' +
                    '<p>Failed to initialize WebGPU. Please ensure you are using a browser that supports WebGPU.</p>' +
                    '<p style="margin-top: 10px; font-size: 0.85rem; color: #aaa;">' + error.message + '</p>';
            }
        }

        run();
    </script>
</body>
</html>
