<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Visual Regression Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="status">Loading WASM...</div>
    <canvas id="fractal-canvas"></canvas>

    <script type="module">
        import init, { WasmApp } from '../../../pkg/fractal_flame_wgpu.js';

        let wasmApp = null;
        let currentConfig = null;
        let renderAnimationFrame = null;

        // Global flags for test runner
        window.wasmReady = false;
        window.renderComplete = false;

        /**
         * Initialize WASM module and WebGPU
         */
        async function initWasm() {
            try {
                // Initialize WASM module
                await init();

                const canvas = document.getElementById('fractal-canvas');

                // Create WASM app instance
                wasmApp = await WasmApp.new(canvas);

                document.getElementById('status').textContent = 'WASM Ready';
                window.wasmReady = true;

            } catch (err) {
                console.error('Failed to initialize WASM:', err);
                document.getElementById('status').textContent = 'WASM Init Failed: ' + err.message;
                throw err;
            }
        }

        /**
         * Load fractal config (called by test runner)
         */
        window.loadFractalConfig = function(config) {
            if (!wasmApp) {
                throw new Error('WASM not initialized');
            }

            try {
                // Store config
                currentConfig = config;

                // Load config into WASM app
                wasmApp.load_config(JSON.stringify(config));

                // Reset render state
                window.renderComplete = false;

                document.getElementById('status').textContent = 'Config Loaded';

            } catch (err) {
                console.error('Failed to load config:', err);
                throw err;
            }
        };

        /**
         * Start rendering (called by test runner)
         */
        window.startRender = function() {
            if (!wasmApp || !currentConfig) {
                throw new Error('WASM not initialized or no config loaded');
            }

            try {
                // Get max iterations from config
                const maxIterations = currentConfig.max_iterations || 1000000000;

                document.getElementById('status').textContent = `Rendering (target: ${maxIterations.toLocaleString()} iterations)`;

                // Start render loop
                let lastTime = performance.now();
                let frameCount = 0;

                function renderFrame() {
                    // Render one frame
                    wasmApp.render_frame();

                    frameCount++;
                    const now = performance.now();
                    const elapsed = now - lastTime;

                    // Update status every 100ms
                    if (elapsed > 100) {
                        const currentIterations = wasmApp.get_current_iterations();
                        const progress = (currentIterations / maxIterations * 100).toFixed(1);

                        document.getElementById('status').textContent =
                            `Rendering: ${currentIterations.toLocaleString()} / ${maxIterations.toLocaleString()} (${progress}%)`;

                        lastTime = now;
                    }

                    // Check if render is complete
                    const currentIterations = wasmApp.get_current_iterations();
                    if (currentIterations >= maxIterations) {
                        // Render complete
                        document.getElementById('status').textContent =
                            `Render Complete: ${currentIterations.toLocaleString()} iterations`;

                        window.renderComplete = true;

                        if (renderAnimationFrame) {
                            cancelAnimationFrame(renderAnimationFrame);
                            renderAnimationFrame = null;
                        }
                    } else {
                        // Continue rendering
                        renderAnimationFrame = requestAnimationFrame(renderFrame);
                    }
                }

                // Start render loop
                renderAnimationFrame = requestAnimationFrame(renderFrame);

            } catch (err) {
                console.error('Failed to start render:', err);
                throw err;
            }
        };

        /**
         * Get canvas element (for screenshot capture)
         */
        window.getCanvas = function() {
            return document.getElementById('fractal-canvas');
        };

        // Initialize on page load
        initWasm().catch(err => {
            console.error('Fatal error:', err);
            document.getElementById('status').textContent = 'Fatal Error: ' + err.message;
        });
    </script>
</body>
</html>
