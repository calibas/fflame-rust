[package]
name = "fractal_flame_wgpu"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
wgpu = "23.0"
egui = "0.30"
egui-winit = "0.30"
egui-wgpu = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
anyhow = "1.0"

# Optional
image = "0.25"

[dev-dependencies]
anyhow = "1.0"
