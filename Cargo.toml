[package]
name = "fractal_flame_wgpu"
version = "0.1.0"
edition = "2021"
default-run = "fractal_flame_wgpu"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
winit = "0.30"
# wgpu = "23.0"
egui = "0.33"
egui_dock = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
log = "0.4"
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
half = "2.4"
rand = { version = "0.8", features = ["getrandom"] }
web-time = "1.1"
rfd = "0.15"
once_cell = "1.19"
chrono = "0.4"
webbrowser = "1.0"

# Optional
image = "0.25"
png = "0.17"
futures = "0.3"
quick-xml = "0.36"
rust-i18n = "3.1"
directories = "6.0"
rayon = "1.10"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.33", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "FileList",
    "File",
    "FileReader",
    "Event",
    "InputEvent",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.2", features = ["js"] }
egui-wgpu = "0.33"
# WebGPU only - WebGL doesn't support compute shaders (required for fractal generation)
wgpu = { version = "27.0", features = ["webgpu"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.33", default-features = true }
env_logger = "0.11"
pollster = { version = "0.4", features = ["macro"] }
clap = { version = "4.5", features = ["derive"] }
egui-wgpu = "0.33"

[build-dependencies]
chrono = "0.4"
rustc_version = "0.4"

[dev-dependencies]
anyhow = "1.0"
criterion = "0.5"

[[bench]]
name = "flame_bench"
harness = false

# [profile.release]
# Optimize for size and performance in WASM
# opt-level = 3
# lto = true
# codegen-units = 1

# [profile.release.package."*"]
# Optimize dependencies
# opt-level = 3
