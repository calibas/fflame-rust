[package]
name = "fractal_flame_wgpu"
version = "0.4.4"
edition = "2021"
# The shipped executable is named for the product. The PACKAGE keeps
# its crate name — that is an internal identifier, and renaming it would
# churn every `use fractal_flame_wgpu::` path, the Python module and the
# wasm-bindgen output for no user-visible gain.
default-run = "FractalArtEditor"

[[bin]]
name = "FractalArtEditor"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
winit = "0.30"
egui = "0.34"
egui_dock = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
log = "0.4"
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
half = "2.4"
rand = { version = "0.9", features = ["os_rng"] }
web-time = "1.1"
rfd = "0.15"
once_cell = "1.19"
chrono = "0.4"
webbrowser = "1.0"

# Optional
# PNG (export, thumbnail cache, visual-regression compare) and JPEG
# (API thumbnail upload) are the only codecs used. Default features
# also pull AVIF encoding (ravif -> rav1e), which dragged in the old
# rand 0.8 line — a dependency we neither use nor want to patch.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"
futures = "0.3"
quick-xml = "0.36"
rust-i18n = "3.1"
directories = "6.0"
rayon = "1.10"
sha2 = "0.10"

# Audio (for audio-reactive animations)
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "pcm"] }
rustfft = "6.2"
ringbuf = "0.4"
# default-features would enable `ahash/runtime-rng`, which makes ahash
# pull getrandom 0.3 — and via feature unification that applies to egui's
# ahash too, breaking the wasm32 build (getrandom 0.3 refuses
# wasm32-unknown-unknown without a cfg flag). We only need `std`; rhai
# still gets ahash's compile-time-rng, which it depends on directly.
rhai = { version = "1.25.1", default-features = false, features = ["std"] }
# Pinned to rand 0.9's rand_core. NOTE: the PCG64-MCG stream and the
# `Uniform` distributions built on it are what `script + seed` MEANS —
# a shareable artifact. The wasm/script CLI-parity fixtures assert the
# generated flames byte-for-byte, so any drift here fails the build
# rather than silently redefining every published seed.
rand_pcg = "0.9"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.34", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "VisualViewport",
    "Location",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "FileList",
    "File",
    "FileReader",
    "Event",
    "InputEvent",
    # Virtual keyboard overlay bridge
    "CustomEvent",
    "CustomEventInit",
    # Clipboard bridge (copy/paste between browser and egui)
    "PointerEvent",
    "PointerEventInit",
    "ClipboardEvent",
    "DataTransfer",
    "Clipboard",
    "KeyboardEvent",
    # HTTP Fetch API (for resources module)
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCredentials",
    "Response",
    "Headers",
    # Web Audio API (for live audio capture)
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioNode",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "Navigator",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "ChannelCountMode",
    "ChannelInterpretation",
    # Screen/Tab audio capture via getDisplayMedia
    "DisplayMediaStreamConstraints",
    "MediaStreamTrack",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1.0"
# rand 0.9's OS entropy source. On wasm32 getrandom 0.3 refuses to
# compile unless a backend is named BOTH as a feature and as a cfg flag
# — the cfg lives in `.cargo/config.toml` at the repo root, which cargo
# also picks up for the standalone wasm/ crates (config discovery walks
# parent directories, workspace boundaries notwithstanding).
# The old `getrandom 0.2 + js` entry here was for rand 0.8; 0.2 now
# survives only under `const-random-macro`, a proc-macro built for the
# HOST, where a browser backend is meaningless.
getrandom = { version = "0.3", features = ["wasm_js"] }
# egui-wgpu default features pull in `wgpu/default` + `wgpu/webgl`.
# wgpu/default enables dx12, which we don't want (transitive dep
# skew with gpu-allocator's windows-rs) and webgl is incompatible
# with our compute-shader requirements. Disable defaults; we don't
# need any of the optional egui-wgpu features on WASM.
egui-wgpu = { version = "0.34", default-features = false }
# WebGPU only — WebGL doesn't support compute shaders (required for
# fractal generation).
wgpu = { version = "29.0", default-features = false, features = ["std", "webgpu", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.34", default-features = true }
env_logger = "0.11"
pollster = { version = "0.4", features = ["macro"] }
clap = { version = "4.5", features = ["derive"] }
# See WASM section for why egui-wgpu defaults are disabled. Re-enable
# macos-window-resize-jitter-fix on desktop (harmless on
# Windows/Linux — just pulls wgpu/metal which only activates on Mac).
egui-wgpu = { version = "0.34", default-features = false, features = ["macos-window-resize-jitter-fix"] }
# Desktop backends: vulkan + metal + gles. dx12 deliberately omitted —
# wgpu 29.0.3's dx12 backend has a transitive dep skew with
# gpu-allocator's windows-rs version, and on Windows we use Vulkan
# anyway (see Backends::VULKAN forcing for SwiftShader compat).
wgpu = { version = "29.0", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "gles", "wgsl"] }
ureq = "2"
aes-gcm = "0.10"
base64 = "0.22"

[features]
# `web-app`: the browser application's wasm-bindgen export surface
# (`wasm_main` boot + the `WasmApi` bindings). ON by default so the
# desktop app, the wasm-pack app build and pyfflame are unchanged.
# wasm-bindgen collects `#[wasm_bindgen]` exports from the ENTIRE
# dependency graph, so the thin gallery crates (wasm/render,
# wasm/script) depend on this crate with default-features = false —
# without the gate they would silently inherit the whole application.
default = ["web-app"]
web-app = []

[build-dependencies]
chrono = "0.4"
rustc_version = "0.4"

[dev-dependencies]
anyhow = "1.0"
criterion = "0.5"

[[bench]]
name = "flame_bench"
harness = false

[profile.release]
incremental = true

[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"  # if you don't need unwinding
