[package]
name = "fractal_flame_wgpu"
version = "0.3.1"
edition = "2021"
default-run = "fractal_flame_wgpu"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
winit = "0.30"
# wgpu = "23.0"
egui = "0.33"
egui_dock = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
log = "0.4"
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
half = "2.4"
rand = { version = "0.8", features = ["getrandom"] }
web-time = "1.1"
rfd = "0.15"
once_cell = "1.19"
chrono = "0.4"
webbrowser = "1.0"

# Optional
image = "0.25"
png = "0.17"
futures = "0.3"
quick-xml = "0.36"
rust-i18n = "3.1"
directories = "6.0"
rayon = "1.10"
sha2 = "0.10"

# Audio (for audio-reactive animations)
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "pcm"] }
rustfft = "6.2"
ringbuf = "0.4"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.33", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Location",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "FileList",
    "File",
    "FileReader",
    "Event",
    "InputEvent",
    # Virtual keyboard overlay bridge
    "CustomEvent",
    "CustomEventInit",
    # Clipboard bridge (copy/paste between browser and egui)
    "PointerEvent",
    "PointerEventInit",
    "ClipboardEvent",
    "DataTransfer",
    "Clipboard",
    "KeyboardEvent",
    # HTTP Fetch API (for resources module)
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestCredentials",
    "Response",
    "Headers",
    # Web Audio API (for live audio capture)
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioNode",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "Navigator",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioDestinationNode",
    "ChannelCountMode",
    "ChannelInterpretation",
    # Screen/Tab audio capture via getDisplayMedia
    "DisplayMediaStreamConstraints",
    "MediaStreamTrack",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.2", features = ["js"] }
egui-wgpu = "0.33"
# WebGPU only - WebGL doesn't support compute shaders (required for fractal generation)
wgpu = { version = "27.0", features = ["webgpu"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.33", default-features = true }
env_logger = "0.11"
pollster = { version = "0.4", features = ["macro"] }
clap = { version = "4.5", features = ["derive"] }
egui-wgpu = "0.33"
ureq = "2"
aes-gcm = "0.10"
base64 = "0.22"

[features]
default = []

[build-dependencies]
chrono = "0.4"
rustc_version = "0.4"

[dev-dependencies]
anyhow = "1.0"
criterion = "0.5"

[[bench]]
name = "flame_bench"
harness = false

[profile.release]
incremental = true

[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"  # if you don't need unwinding
